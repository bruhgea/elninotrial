name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore todoapp.slnx

      - name: Build
        run: dotnet build todoapp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test todoapp.slnx --no-build --configuration Release

      - name: Build Docker image
        run: docker build -t todoapp-api ./testproject